  <path d="M29 23 H35 C35.5 23 36 23.5 36 24 C36 24.5 35.5 25 35 25 H29 C28.5 25 28 24.5 28 24 C28 23.5 28.5 23 29 23 Z" fill="url(#goldGrad)"/>
  <path d="M19 26 Q32 24 45 26 C46 26.5 46 27.5 45 28 Q32 26 19 28 C18 27.5 18 26.5 19 26 Z" fill="url(#goldGrad)"/>

